name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # crates/lotel/extensions/ is gitignored; build.rs stubs the embedded
      # extension blobs so the crate compiles without them. Unit tests cover
      # the pure logic; full ingest smoke runs locally with real extensions
      # (scripts/smoke.sh).
      - name: Unit tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release
