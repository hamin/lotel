# duckdb.lock: DuckDB's own prebuilt static libraries, one archive per
# platform, linked into the binary instead of compiling DuckDB from source.
# build.rs downloads the row for the target platform and checks its sha256;
# `just fetch-extensions` keeps an unpacked copy in crates/lotel/duckdb/ so a
# `cargo clean` does not mean downloading it again. Build with
# `--features bundled-duckdb` to compile DuckDB from source instead.
#
# The version must match the duckdb crate pin in Cargo.toml (1.20000.x is
# DuckDB 2.0.0) and the duckdb_version in extensions.lock.
#
# Format: <platform> <sha256-of-the-tar.gz> <url>

