# extensions.lock — pinned extension blobs fetched by scripts/fetch-extensions.sh
# The binary embeds these at compile time (include_bytes! in db.rs),
# so what ships is exactly what is listed here — verified by sha256 on every
# fetch. Rotate deliberately: update the row, re-download, update the hash.
#
# Format (whitespace-separated, one row per extension × platform):
#   <extension> <platform> <sha256-of-uncompressed-blob> <url>
# Lines starting with # and blank lines are ignored. A url of "-" means
# "source build": the fetch script takes the blob from $CAPPED_EXT, else the
# sibling release build (capped has no published release yet).
#
# sha256 is taken AFTER gunzip — the registry serves gzips; the uncompressed
# bytes are what the binary embeds and what the hash protects.
#
# Hosts: fts is a core extension (extensions.duckdb.org); otlp is a community
# extension (community-extensions.duckdb.org) — both are the same paths the
# duckdb CLI's `INSTALL … FROM community` resolves to (see the *.info files
# under ~/.duckdb/extensions/v2.0.0/osx_arm64/).

